<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="96" cy="96" r="96" fill="url(#waveGradient)"/>

  <!-- Wave shape -->
  <path d="M20 120 Q40 100 60 120 Q80 140 100 120 Q120 100 140 120 Q160 140 180 120 L180 192 L20 192 Z"
        fill="rgba(255,255,255,0.2)"/>

  <!-- Wave lines -->
  <path d="M15 110 Q35 90 55 110 Q75 130 95 110 Q115 90 135 110 Q155 130 175 110"
        stroke="white" stroke-width="3" fill="none"/>
  <path d="M15 125 Q35 105 55 125 Q75 145 95 125 Q115 105 135 125 Q155 145 175 125"
        stroke="white" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Text "WZ" -->
  <text x="96" y="110" font-family="Arial, sans-serif" font-size="48" font-weight="bold"
        text-anchor="middle" fill="white">WZ</text>

  <!-- Small wave emoji effect -->
  <text x="96" y="140" font-size="24" text-anchor="middle">🌊</text>
</svg>










